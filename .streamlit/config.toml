[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f5f7f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#111111"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "medium"
showWidgetBorder = true
borderColor = "#dfe7e2"
dataframeHeaderBackgroundColor = "#eef1ee"
dataframeHeaderTextColor = "#111111"
dataframeBorderColor = "#cfdad5"
chartCategoricalColors = ["#0f766e", "#e29a2d", "#3867d6", "#c45161", "#5b6b7a", "#7b61a8", "#2f9e79"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f4"
textColor = "#111111"
primaryColor = "#0f766e"
borderColor = "#dfe7e2"

[server]
runOnSave = true
